name: Visual Spike

on:
  push:
    branches:
      - "**"

permissions:
  actions: read
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Install browser
        working-directory: packages/react
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow visual-spike.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --name visual-baseline --dir packages/react/visual-baseline; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare
        if: github.ref_name != 'main' && steps.baseline.outputs.found == 'true'
        working-directory: packages/react
        run: pnpm exec vitest run -c vitest.visual.config.ts

      - name: Update baseline
        if: github.ref_name == 'main' || steps.baseline.outputs.found != 'true'
        working-directory: packages/react
        run: pnpm exec vitest run -c vitest.visual.config.ts --update

      - name: Upload baseline
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline
          path: packages/react/visual-baseline
          retention-days: 30
          if-no-files-found: error

      - name: Upload diff
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: packages/react/.vitest/attachments
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
